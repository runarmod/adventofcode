[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aoc_utils_runarmod"
version = "0.0.1"
authors = [{ name = "Runar Saur Modahl", email = "runarmod@gmail.com" }]
description = "A simple package to help with Advent of Code"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "beautifulsoup4",
    "colorama",
    "markdownify",
    "pause",
    "pyperclip",
    "pytz",
    "requests",
    "tqdm",
]

[project.urls]
Homepage = "https://github.com/runarmod/adventofcode"
Issues = "https://github.com/runarmod/adventofcode/issues"

[project.scripts]
aoc-utils = "aoc_utils_runarmod.__main__:main"
