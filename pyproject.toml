[project]
name = "adventofcode"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aoc-utils-runarmod",
    "frozendict",
    "matplotlib",
    "more-itertools>=8.11",
    "networkx",
    "numpy",
    "pyperclip",
    "scipy",
    "shapely>=2.0",
    "sympy",
    "toposort",
    "tqdm",
    "z3-solver",
]

[tool.uv.workspace]
members = [
    "package",
]

[tool.uv.sources]
aoc-utils-runarmod = { workspace = true }

[tool.ruff]
# Same as the pre-commit exclude: only lint/format 2025 onwards
extend-exclude = ["201[5-9]", "202[0-4]"]

[tool.ruff.lint.per-file-ignores]
# The template's imports are unused on purpose, so they are ready to use
"template.py" = ["F401"]
